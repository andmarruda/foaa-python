[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "foaa"
version = "0.1.0.dev0"
description = "Flower-Orchestrated Agent Architecture: an orchestrator that governs, coordinates, and observes the agent harnesses you already use."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Anderson Matheus Arruda" }]
keywords = ["agents", "multi-agent", "orchestration", "governance", "observability", "mcp", "rag"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
# The core has no runtime dependencies (Constitution, Principle IV).
dependencies = []

[project.optional-dependencies]
# Clients for the bundled adapters. FOAA never imports them itself: you create the client
# and pass it in (see foaa.adapters and docs/adapters.md).
mcp = ["mcp>=1.0"]              # McpSessionConnection (FOAA is an MCP client only)
anthropic = ["anthropic>=1.0"]  # AnthropicModel
openai = ["openai>=1.40"]       # OpenAICompatibleModel

[project.urls]
Repository = "https://github.com/andmarruda/foaa-python"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["foaa"]

[tool.hatch.build.targets.sdist]
exclude = ["docs/foaa.pdf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["foaa"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
